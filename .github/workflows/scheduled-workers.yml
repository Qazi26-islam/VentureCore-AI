name: Scheduled VentureCore workers

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run due briefings and alerts
        env:
          WORKER_URL: ${{ secrets.VENTURECORE_WORKER_URL }}
          WORKER_SECRET: ${{ secrets.VENTURECORE_WORKER_SECRET }}
        run: |
          curl --fail-with-body --max-time 300 \
            --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "${WORKER_URL%/}/internal/jobs/run" \
            -H "Authorization: Bearer ${WORKER_SECRET}"
